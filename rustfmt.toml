# Rust 2024 edition formatting configuration
# https://doc.rust-lang.org/edition-guide/rust-2024/rustfmt-style-edition.html

# Use the 2024 style edition for formatting
style_edition = "2024"

# Edition for parsing (should match Cargo.toml)
edition = "2024"

# Stable formatting options for consistency
max_width = 100
use_small_heuristics = "Default"
use_field_init_shorthand = true
use_try_shorthand = true

# Note: Many formatting options are still unstable and require nightly
# When they stabilize, consider enabling:
# - imports_granularity = "Crate"
# - group_imports = "StdExternalCrate"
# - format_code_in_doc_comments = true
# - normalize_comments = true
# - wrap_comments = true