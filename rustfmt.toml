# Rust 2024 edition formatting configuration
# https://doc.rust-lang.org/edition-guide/rust-2024/rustfmt-style-edition.html

# Use the 2024 style edition for formatting
style_edition = "2024"

# Edition for parsing (should match Cargo.toml)
edition = "2024"

# Additional formatting options for consistency
max_width = 100
use_small_heuristics = "Default"
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
format_code_in_doc_comments = true
normalize_comments = true
normalize_doc_attributes = true
wrap_comments = true

# Keep these for better readability in educational code
use_field_init_shorthand = true
use_try_shorthand = true
format_strings = true
format_macro_matchers = true
format_macro_bodies = true

# For consistent error formatting
error_on_line_overflow = false
error_on_unformatted = false