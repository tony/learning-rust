[workspace]
members = ["courses/*"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# CLI tools
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Testing
proptest = "1.5"
criterion = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# FFI
pyo3 = { version = "0.22", features = ["auto-initialize"] }

# Utilities
rand = "0.8"
tempfile = "3.14"
thiserror = "2.0"

# Keep old package for backward compatibility
[package]
name = "learning-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
